<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viper chat</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to the conversation</a>
<div id="banner" role="alert" class="banner" hidden></div>
<header class="top">
  <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg> viper chat</h1>
  <span id="version" class="pill"></span>
  <span class="sp"></span>
  <span id="me" class="me" role="status"></span>
  <label class="sr" for="lang" data-i18n="lang.label">Language</label>
  <select id="lang"><option value="en">English</option><option value="de">Deutsch</option></select>
</header>
<div class="shell">
  <nav class="list" id="list-pane" aria-label="Conversations" data-i18n-label="list.label">
    <div id="groups"></div>
  </nav>
  <main id="main" tabindex="0">
    <section id="empty" class="empty" hidden></section>
    <section id="conv" hidden>
      <header class="ch"><div class="av" id="conv-av" aria-hidden="true"></div><div><h2 id="conv-name"></h2><p id="conv-sub" class="muted"></p></div>
        <label class="sr" for="filter" data-i18n="filter.label">Show</label>
        <select id="filter" class="filter" hidden><option value="all" data-i18n="filter.all">Everything</option><option value="msg" data-i18n="filter.msg">Messages</option><option value="req" data-i18n="filter.req">Questions</option><option value="res" data-i18n="filter.res">Answers</option></select></header>
      <div id="msgs" class="msgs" role="log" aria-live="polite" aria-label="Messages" data-i18n-label="msgs.label"><p id="conv-empty" class="muted" data-i18n="msgs.none">No messages yet.</p></div>
      <form id="composer" class="composer" hidden>
        <div id="ack" class="notice" role="alert" hidden><span id="ack-text"></span> <button type="button" id="ack-ok" data-i18n="send.ack">Understood, send</button></div>
        <div id="replying" class="notice" hidden><span id="replying-text"></span> <button type="button" id="replying-x" data-i18n="send.cancel">Cancel</button></div>
        <label class="sr" for="text" data-i18n="send.label">Your message</label>
        <textarea id="text" rows="3" spellcheck="false" data-i18n-placeholder="send.placeholder" placeholder="Write a message (Ctrl+Enter sends)"></textarea>
        <div id="chip" class="chip" hidden><span id="chip-text"></span> <button type="button" id="chip-x" data-i18n="file.remove">Remove</button></div>
        <div class="row">
          <button type="button" id="attach" class="plain" data-i18n="file.attach">Attach file</button>
          <input type="file" id="picker" class="sr" tabindex="-1" aria-hidden="true">
          <label class="sr" for="kind" data-i18n="send.kind">Kind</label>
          <select id="kind"><option value="msg" data-i18n="send.msg">Message</option><option value="ask" data-i18n="send.ask">Question</option></select>
          <label class="sr" for="wait" data-i18n="send.wait">How long to wait for the answer</label>
          <select id="wait" hidden><option value="30">30 s</option><option value="60">60 s</option><option value="120">120 s</option></select>
          <span id="count" class="muted"></span>
          <span id="send-status" class="muted" role="status"></span>
          <button type="submit" id="send" class="primary" data-i18n="send.go">Send</button>
        </div>
      </form>
    </section>
  </main>
</div>
<script src="/i18n.js"></script>
<script src="/chat.js"></script>
</body>
</html>
