# .golangci.yml — lint profile of viper (make lint), same strictness as odata-recorder.
#
# Exceptions live only here (`exclusions.rules` and the errcheck function list), each with a
# comment block whose first line starts with "# Why:". No //nolint in the code; nolintlint reports one without a
# reason, a named linter or an effect.

version: "2"

run:
  relative-path-mode: cfg

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - containedctx
    - contextcheck
    - cyclop
    - depguard
    - dupl
    - fatcontext
    - forbidigo
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - iface
    - inamedparam
    - interfacebloat
    - ireturn
    - maintidx
    - nestif
    - nolintlint
    - noctx
    - reassign
    - revive
    - testpackage
    - unparam

  settings:
    errcheck:
      # Why: a write to a bytes.Buffer, a strings.Builder or the output the user sees is not
      # something the program could act on when it fails.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    cyclop:
      max-complexity: 15

    dupl:
      threshold: 150

    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: write to an io.Writer that is passed in
        - pattern: ^print(ln)?$
          msg: write to an io.Writer that is passed in
        - pattern: ^os\.Std(out|err)$
          msg: only the command line (internal/adapter/driving/cli) and cmd/viper use os.Stdout and os.Stderr

    funlen:
      lines: 100
      statements: 60

    gocognit:
      min-complexity: 20

    gocyclo:
      min-complexity: 15

    interfacebloat:
      max: 10

    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic

    maintidx:
      under: 20

    nestif:
      min-complexity: 5

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    # Dependency direction. (Cycles between the packages of internal/ are refused by the compiler;
    # these rules keep the fakes and the integration tests out of the program.)
    depguard:
      rules:
        no-integration-import:
          list-mode: lax
          files:
            - $all
            - "!**/internal/integration/**"
          deny:
            - pkg: github.com/pt9912/hetzner-viper/internal/integration
              desc: integration tests are not a library
        no-test-fakes-in-code:
          list-mode: lax
          files:
            - "!$test"
            - "!**/internal/integration/**"
          deny:
            - pkg: github.com/pt9912/hetzner-viper/internal/servertest
              desc: the fakes are for tests only

        # The layers: model <- port <- usecase <- app; adapters sit beside the use cases, between
        # the ports and app. Only app (the composition root) knows all of them.
        model-imports-nothing:
          list-mode: lax
          files:
            - "**/internal/model/**"
            - "!$test"
          deny:
            - pkg: github.com/pt9912/hetzner-viper/internal
              desc: the model is plain types; it imports nothing of viper
        ports-know-only-the-model:
          list-mode: lax
          files:
            - "**/internal/port/**"
            - "!$test"
          deny:
            - pkg: github.com/pt9912/hetzner-viper/internal/adapter
              desc: a port is a contract; an adapter fulfils it
            - pkg: github.com/pt9912/hetzner-viper/internal/usecase
              desc: a port is a contract; a use case uses or offers it
            - pkg: github.com/pt9912/hetzner-viper/internal/app
              desc: only app wires
        usecases-know-ports-not-adapters:
          list-mode: lax
          files:
            - "**/internal/usecase/**"
            - "!$test"
          deny:
            - pkg: github.com/pt9912/hetzner-viper/internal/adapter
              desc: a use case knows its providers only through internal/port; app picks the adapter
            - pkg: github.com/pt9912/hetzner-viper/internal/app
              desc: only app wires
        driven-adapters-fulfil-ports:
          list-mode: lax
          files:
            - "**/internal/adapter/driven/**"
            - "!$test"
          deny:
            - pkg: github.com/pt9912/hetzner-viper/internal/usecase
              desc: a driven adapter serves the use cases through a port, it does not call them
            - pkg: github.com/pt9912/hetzner-viper/internal/adapter/driving
              desc: driven and driving adapters do not know each other
            - pkg: github.com/pt9912/hetzner-viper/internal/app
              desc: only app wires
        driving-adapters-call-ports:
          list-mode: lax
          files:
            - "**/internal/adapter/driving/**"
            - "!$test"
          deny:
            - pkg: github.com/pt9912/hetzner-viper/internal/usecase
              desc: a driving adapter calls the use cases through internal/port/driving
            - pkg: github.com/pt9912/hetzner-viper/internal/adapter/driven
              desc: driven and driving adapters do not know each other; app connects them
            - pkg: github.com/pt9912/hetzner-viper/internal/app
              desc: only app wires

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
        - name: unused-receiver

    testpackage:
      skip-regexp: (^|/)export_test\.go$

  exclusions:
    warn-unused: true
    rules:
      # Why: app is the composition root; the functions that pick or open an adapter return the
      # port it fulfils (cloud.Provider, runlog.Run) by design.
      - linters:
          - ireturn
        path: ^internal/app/

      # Why: the tests of the command line drive its unexported commands (options, host, runUp), as
      # they did when the commands were package main; an external test package cannot reach them.
      - linters:
          - testpackage
        path: ^internal/adapter/driving/cli/.+_test\.go$

      # Why: table-driven tests have higher complexity without a design flaw.
      - linters:
          - cyclop
          - gocognit
          - gocyclo
          - nestif
          - funlen
        path: ^.+_test\.go$

      # Why: tests need neither context passing nor used-up parameters.
      - linters:
          - noctx
          - unparam
        path: ^.+_test\.go$

      # Why: fakes in test files fill an interface with parameters and receivers they do not use.
      - linters:
          - revive
        path: ^.+_test\.go$
        text: ^unused-(parameter|receiver)

      # Why: the error texts of this program are messages for the user and begin with a capital
      # letter ("Set DNS_DOMAIN ..."), also where they are passed up inside the program.
      - linters:
          - staticcheck
        text: ^ST1005

      # Why: the command line is the driving adapter; it connects the process to its standard streams.
      - linters:
          - forbidigo
        path: ^(cmd/viper|internal/adapter/driving/cli)/
        text: os\.Std(out|err)
