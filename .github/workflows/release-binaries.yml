name: release binaries

# Attaches the viper binaries to the release of a v* tag (Go cross-compiles them all on one runner).
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq shellcheck openssh-server openssh-client git
      - run: sudo mkdir -p /run/sshd
      - run: go test ./...
        env:
          VIPER_REQUIRE_TOOLS: "1"
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/viper_${GITHUB_REF_NAME}_${os}_${arch}" ./cmd/viper
          done
          (cd dist && sha256sum viper_* > SHA256SUMS)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the tag push and the release are created together; give the release a moment to exist
          for _ in $(seq 12); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 5; done
          gh release view "$GITHUB_REF_NAME" >/dev/null   # fails here, clearly, if there is none
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
