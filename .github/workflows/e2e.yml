name: browser tests

# The pages of viper ui in a real browser (e2e/, Playwright). Only when what they test changes.
on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: all three engines. macOS and Windows are there for what only they can show: the Interrupt of a run
          # (SIGINT, CTRL_BREAK), paths and the program names of the system, and the real WebKit of Safari on macOS.
          - { os: ubuntu-24.04, browser: chromium }
          - { os: ubuntu-24.04, browser: firefox }
          - { os: ubuntu-24.04, browser: webkit }
          - { os: macos-latest, browser: chromium }
          - { os: macos-latest, browser: webkit }
          - { os: windows-latest, browser: chromium }
    name: ${{ matrix.os }} ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.os }}-${{ matrix.browser }}
          path: e2e/test-results
          retention-days: 7
