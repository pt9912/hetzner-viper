name: machine image

# Builds the image of the machines of the providers kubernetes and compose (image/Dockerfile) for amd64 and arm64, tests
# each (image/test.sh: sshd, host certificate, tools, the volume of a cluster, NATS) and publishes them to the GitHub
# Container Registry as one multi-platform image: ghcr.io/<owner>/viper-machine:<tag> and :latest. Each architecture is
# built and tested on a runner of its own (no emulation: the first start puts Homebrew on a volume, which would crawl under
# QEMU); the images are pushed as <tag>-amd64 and <tag>-arm64 and joined into <tag> only when both tests have passed.
# It runs when a release tag v* is pushed, or by hand for an existing tag:
#   gh workflow run "machine image" -f tag=v0.18.0
# A tag is never moved. If only the test (image/test.sh) or the workflow was wrong, build the image of the tag with the
# files of a later commit: -f ref=main. The run stops if a file that goes into the image differs between the tag and
# the ref, so the image is the one the tag describes.
# The package ghcr.io/<owner>/viper-machine is public (checked with an anonymous request for v0.18.0), so a cluster pulls
# it without an image pull secret. If it is ever private (GitHub: Packages > viper-machine > Package settings > Change
# visibility), every cluster needs a pull secret (K8S_IMAGE_PULL_SECRET).
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build the image of
        required: true
      ref:
        description: 'Optional: take the files from this branch or commit instead of the tag (the image files must be equal)'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || env.TAG }}
          fetch-depth: 0
          fetch-tags: true
      - name: Check that the ref has the image files of the tag
        if: inputs.ref != ''
        run: |
          set -euo pipefail
          files="image/Dockerfile cloud-init.yaml image/seed.py image/sshd_config image/entry.sh image/nats-supervisor.sh"
          if ! git diff --quiet "refs/tags/${TAG}" HEAD -- $files; then
            echo "::error::the image files of ${TAG} and ${{ inputs.ref }} differ: the image would not be the one the tag describes"
            git diff --stat "refs/tags/${TAG}" HEAD -- $files
            exit 1
          fi
          echo "the image files of ${TAG} and ${{ inputs.ref }} are equal"
      - name: Build
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # registry names are lowercase
          echo "IMAGE=ghcr.io/${owner}/viper-machine" >> "$GITHUB_ENV"
          docker build -f image/Dockerfile -t "ghcr.io/${owner}/viper-machine:${TAG}-${ARCH}" .
      - name: Test
        run: image/test.sh "${IMAGE}:${TAG}-${ARCH}"
      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push
        run: docker push "${IMAGE}:${TAG}-${ARCH}"

  manifest:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Join the images of both architectures
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/viper-machine"
          tags=("-t" "${image}:${TAG}")
          # latest follows the release that was just tagged, not an old tag built by hand
          if [ "${GITHUB_EVENT_NAME}" = push ]; then tags+=("-t" "${image}:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${image}:${TAG}-amd64" "${image}:${TAG}-arm64"
          docker buildx imagetools inspect "${image}:${TAG}"
