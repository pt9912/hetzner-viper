name: rerun cancelled jobs

# GitHub does not start a macOS job when its runners are short ("The job was not acquired by Runner of type hosted even after
# multiple attempts"): the job ends as cancelled without a step, and the run is red without a test having failed. This starts the
# jobs that were cancelled once more, twice at most. A run in which a job failed or timed out is left alone: that is a real
# result.
on:
  workflow_run:
    workflows: [tests, browser tests]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: start the cancelled jobs again, if nothing failed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          GH_REPO: ${{ github.repository }} # gh needs it: there is no checkout here
        run: |
          conclusions=$(gh api "repos/$REPO/actions/runs/$RUN/jobs" --paginate --jq '.jobs[].conclusion')
          echo "$conclusions"
          if echo "$conclusions" | grep -qE '^(failure|timed_out)$'; then
            echo "a job failed: no new start"
            exit 0
          fi
          if echo "$conclusions" | grep -qx cancelled; then
            gh run rerun "$RUN" --failed
          fi
