name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # the same as locally: gofmt, go vet, golangci-lint and the tests run in the containers of
      # the Dockerfile (Go and the tools the tests need: sshd, ssh-keygen, jq, shellcheck; a missing
      # tool fails the tests instead of skipping them)
      - run: make check

  # Only the tests: those that need Unix (file modes, symlinks, the bash fake server) skip themselves on Windows.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
