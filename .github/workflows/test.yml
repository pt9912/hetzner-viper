name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # the tests run the scripts that go to the server for real (bash, git, jq, ssh-keygen) and,
      # if there is one, against a real sshd (it needs this directory)
      - run: sudo mkdir -p /run/sshd
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
