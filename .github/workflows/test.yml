name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # the toolchain of the devcontainer (.devcontainer/Dockerfile): Go, golangci-lint and the tools
      # the tests need; a missing tool fails the tests instead of skipping them
      - run: tools/ci-devcontainer.sh check

  # Only the tests: those that need Unix (file modes, symlinks, the bash fake server) skip themselves on Windows.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # the MCP server for this system, which viper embeds (viper mcp-binary --host); the test insists that it is there
      - run: go build -trimpath -buildvcs=false -ldflags "-s -w" -o internal/mcpbin/bin/viper-nats-mcp_windows_amd64.exe ./cmd/viper-nats-mcp
        env:
          CGO_ENABLED: "0"
      - run: go test ./...
        env:
          VIPER_REQUIRE_MCP_HOST: "1"

  # The tests of the interface on macOS (signals, process groups, the programs of the system). The other packages have Unix tests
  # that were written for Linux (bash 5, GNU tools) and are not run here.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make mcp-host
      - run: go test ./internal/adapter/driving/... ./internal/model/... ./internal/mcpbin/...
        env:
          VIPER_REQUIRE_MCP_HOST: "1"
