name: price sources

# viper find reads web pages of Hetzner and Google, which are no interface and change without notice.
# Every night this checks that what viper reads from them (and from the lists of AWS and Azure and the
# rates of the ECB) is still there, and opens an issue if not. The checks look at the form (enough types,
# the known ones among them, prices above zero), not at the prices. A source that cannot be reached skips
# its check and does not open an issue: that says nothing about viper.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ISSUE_TITLE: "viper find: Preisquellen lassen sich nicht mehr auswerten"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: live
        run: |
          set -o pipefail
          go test -tags live -count=1 -timeout 20m -v ./internal/live/ 2>&1 | tee live.log

      # a source that is skipped every night would go unseen: show it on the page of the run
      - name: say which sources were skipped
        if: always()
        run: |
          [ -f live.log ] || exit 0
          grep -E '^\s*--- SKIP' live.log | while read -r line; do
            echo "::warning title=source not reached::$line"
          done || true

      # a finding: one issue, and a comment on it for every night the finding stays
      - name: open or update the issue
        if: always() && steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # a test that failed is a finding; a build error, the timeout or a missing module is not
          if ! grep -q -- '--- FAIL' live.log; then
            echo "::error::the check broke without a finding (build, setup or timeout): no issue, see the log"
            exit 0
          fi
          {
            echo "Die nächtliche Prüfung der Quellen von \`viper find\` hat etwas gefunden: Eine Quelle antwortet, aber \`viper\` kann sie nicht mehr wie bisher auswerten (die Seite oder Liste hat sich vermutlich geändert)."
            echo
            echo "Lauf: $RUN_URL"
            echo
            echo '```'
            grep -E '^(=== RUN|--- (FAIL|SKIP|PASS)|\s+\S+_test\.go:[0-9]+|FAIL|panic)' live.log | head -60
            echo '```'
            echo
            echo "Wo die Auswertung steht: \`docs/maintainer/architektur.md\`, Abschnitt Preisquellen von find."
          } > body.md
          number=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi

      # all sources read again and none skipped: the finding is gone
      - name: close the issue
        if: always() && steps.live.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if grep -q -- '--- SKIP' live.log; then
            echo "a source could not be reached: the issue stays as it is"
            exit 0
          fi
          number=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Alle Quellen lassen sich wieder auswerten: $RUN_URL"
          fi
