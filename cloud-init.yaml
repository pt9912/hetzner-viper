#cloud-config
package_update: true
# install all updates during setup; if they need a reboot (kernel), restart once at the end
# (start.sh waits for it on new servers)
package_upgrade: true
power_state:
  mode: reboot
  delay: now
  message: Rebooting once after the package upgrades
  condition: test -f /var/run/reboot-required
packages:
  - docker.io
  - git
  - gh
  - make
  - build-essential
  - curl
  - ca-certificates
  - tmux
  - jq
  - openssh-server
  - psmisc
users:
  - name: builder
    shell: /bin/bash
    groups: [sudo, docker]
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
ssh_pwauth: false

disable_root: true

write_files:
  - path: /etc/ssh/sshd_config.d/01-keys-only.conf
    owner: root:root
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
      PermitRootLogin no
      PermitEmptyPasswords no
      AuthenticationMethods publickey

runcmd:
  - sshd -t
  - systemctl try-reload-or-restart ssh
  - systemctl enable --now docker
  - mkdir -p /home/builder/.ssh
  - chown builder:builder /home/builder/.ssh
  - chmod 700 /home/builder/.ssh
  - su - builder -c 'set -o pipefail; curl -fsSL https://claude.ai/install.sh | bash' && touch /var/tmp/claude-ready
  # Everything is set up on the first boot. Later boots (e.g. the reboot after the upgrades)
  # skip cloud-init: Hetzner's datasource otherwise retries DHCP for metadata there, fails after
  # 30 s and leaves 'status: error' although the network (already configured) works.
  - touch /etc/cloud/cloud-init.disabled
